[package]
name = "rsprobe"
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Milan Rother"]
repository = "https://github.com/milanofthe/rsprobe"
description = "Scopes, additive measures and one run record for numerical solvers"

[features]
# Without `on` every macro expands to `()` and records nothing.
default = []
on = []
# Counts allocations through `Alloc` into `bytes`, `allocs` and `freed`.
alloc = ["on"]
# `rsprobe::Logger` (log records to events) and `rsprobe::LogSink` (events to log).
log = ["dep:log"]

[dependencies]
log = { version = "0.4", optional = true }

[dev-dependencies]
# Parses the record in the tests.
serde_json = "1"

[workspace]
# The tool that reads records and traces (tool/).
members = ["tool"]
