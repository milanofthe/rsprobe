[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rsprobe"
version = "0.1.0"
description = "Reads rsprobe run records: report, compare, ab"
license = { text = "MIT" }
requires-python = ">=3.9"

[project.scripts]
rsprobe = "rsprobe.__main__:main"

[tool.setuptools]
packages = ["rsprobe"]
